name: Deploy to GitHub Pages (custom)
on: {push: {branches: [main]}, workflow_dispatch: null}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs: {deploy: {environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}, runs-on: ubuntu-latest, timeout-minutes: 30, steps: [{uses: actions/checkout@v4}, {uses: actions/configure-pages@v5}, {uses: actions/upload-pages-artifact@v3, with: {path: .}}, {id: deployment, uses: actions/deploy-pages@v4, timeout-minutes: 25, with: {timeout: 1800000, error_count: 20, reporting_interval: 10000}}]}}
